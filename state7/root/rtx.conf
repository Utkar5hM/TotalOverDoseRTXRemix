rtx.terrainTextures = 0x259F7EEC1A02EC6A
rtx.lightmapTextures = 0xAA8477192F52CB42
rtx.particleTextures = -0x259F7EEC1A02EC6A
rtx.decalTextures = -0x259F7EEC1A02EC6A

rtx.captureInstances = True
# Moving-geometry diagnostic/fix candidate: TOD has many repeated nearby meshes
# and CPU-updated billboards. Remix's default 300-unit instance search radius can
# match the wrong previous-frame object; 25 keeps a small history radius without
# allowing nearby repeated meshes to steal each other's previous-frame identity.
rtx.uniqueObjectDistance = 25.0
rtx.dlfg.enable = True
rtx.dlfg.maxInterpolatedFrames = 1
rtx.postfx.enable = False
# Auto-exposure adapts to average scene brightness and WASHED the warm sky to blue
# (user feedback). The original is bright because TOD bakes its lighting into vertex
# colors; Remix only uses 60% of that by default (vertexColorStrength), which is the
# real "everything darkened" cause. So instead of auto-exposure, use TOD's own baked
# lighting fully - brightens the world without touching/washing the sky.
rtx.autoExposure.enabled = False
rtx.vertexColorStrength = 1.3
rtx.bloom.enable = False
