# Total Overdose RTX Remix support config.
# RT descriptor hashes are required alongside the ASI's generic RT/camera support.
rtx.enableRaytracing = True
rtx.graphicsPreset = 0

# Sky is identified at runtime by the ASI marking TOD's real SkyBox mesh draws.
rtx.skyAutoDetect = 0
rtx.skyMinZThreshold = 0.99
rtx.skyBrightness = 4.0

# FOG/HAZE - the proper RTX Remix way (NVIDIA volumetrics docs + dxvk-remix source).
# Use the BASE volumetric with manual params, NOT the legacy game-fog remap. The remap
# fogged the SKY (sky is at infinite distance -> it accumulates the FULL fog color
# there regardless of transmittance distance), which painted the whole sky orange/green
# and hid the real skybox. The base volumetric instead only fills the froxel grid out
# to froxelMaxDistanceMeters, so the WORLD gets a light haze while the SKY beyond the
# grid keeps its real skybox color. Default froxelMaxDistanceMeters=20m (tiny) is why
# there was "no fog at all"; extended below to cover the world.
#  - transmittanceColor: haze color (light warm-neutral / dusty). Near-white = subtle.
#  - transmittanceMeasurementDistanceMeters: density; HIGHER = lighter haze.
#  - froxelMaxDistanceMeters: how far the haze reaches; raise for distant haze.
rtx.enableFog = False
rtx.volumetrics.enableFogRemap = False
rtx.volumetrics.enableFogColorRemap = False
rtx.volumetrics.enable = True
rtx.volumetrics.transmittanceColor = 0.94, 0.92, 0.88
rtx.volumetrics.transmittanceMeasurementDistanceMeters = 180
rtx.volumetrics.froxelMaxDistanceMeters = 3000


rtx.raytracedRenderTarget.enable = True
rtx.raytracedRenderTargetTextures = 0x1E604227861E0BCB, 0x261F0A146E18E6FA, 0x4E44041F9E27548B, 0x4E44041F9E27548E, 0x572A88A0A2E43086, 0x609466F92E702865, 0xB566CD7C690A3630, 0xD824D823D9CCF030, 0xF885C65160789A8B

