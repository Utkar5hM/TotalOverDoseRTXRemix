; ===========================================================================
; Render distance (far-clip) extension.
;
; FarClip extends TOD's camera far-clip / projection limit so the world draws
; farther. This is the ONLY render-distance control the shim applies.
;
; The LOD experiments (LodFactor, traverse-distance, and a D3D9 texture mip-bias
; override) were removed from the shim on 2026-06-07: they did not fix the
; distant-texture blur, which is TOD's own texture streaming, not something the
; shim can change. The shim no longer touches TOD's LodFactor or traverse distance.
;
; Hot-reloaded once per second. Restart the game after lowering FarClip or
; disabling this section, because already-patched camera objects keep their
; previous far clip until TOD recreates them.
; ===========================================================================

[RenderDistance]
Enabled=1
FarClip=8000.0

; ===========================================================================
; INACTIVE as of 2026-06-07. The ASI no longer injects a sun light:
; kInjectSunLight = false in TODCameraResend.cpp. TOD's sky/skybox already casts
; the correct single sun shadow via Remix's environment probe; injecting a second
; directional light produced a competing "two opposite shadows" (it pointed a
; different way than the skybox sun, even when auto-aimed at the lens-flare sun).
;
; These values are kept for reference only and have NO effect while injection is
; disabled. To experiment with a crisp directional sun again you must re-enable
; kInjectSunLight (and kEnableSunAutoAim for SpriteHashHex/AutoAim) and rebuild,
; AND tame rtx.skyBrightness so the skybox shadow doesn't double up.
; ===========================================================================

[Sun]
; D3D directional light vector (fallback used only if AutoAim can't see the sun).
; Negative Y points downward. Flip X/Z to rotate the shadow direction.
DirectionX=-0.48
DirectionY=-0.8
DirectionZ=-0.25

DiffuseR=3.4
DiffuseG=3.05
DiffuseB=2.55
SpecularScale=1.0
Range=100000.0

; Auto-aim: read where TOD draws the sun billboard each frame and aim the injected
; light opposite it. SpriteHashHex is the Remix texture hash of TOD's sun/flare
; sprite (config, never in the binary). Confirmed working when active.
AutoAim=1
SpriteHashHex=0x5EF9EBC260F4B6BC

; ===========================================================================
; Diagnostic asset capture. Disabled means zero LOD/probe behavior changes.
;
; Set Enabled=1 only after loading the map/sector to inventory. The shim waits,
; cycles TOD's native Script::LodFactor, calls Texture::DrawAllTextures for each
; factor, dumps unique hash-named DDS files, and restores the original factor.
; Toggle back to 0 before starting another pass, then back to 1 once positioned.
;
; Output:
;   rtx-remix\logs\tod-forced-texture-probe
;   rtx-remix\logs\tod-asset-capture.log
; ===========================================================================

[AssetCapture]
Enabled=0
StartDelayFrames=180
SettleFrames=120
ProbeFrames=3
LodFactors=0.05,1.0,8.0

; ===========================================================================
; Fully automated asset-block crawler. Requires a game restart after replacing
; the ASI. When enabled, TOD's own Scene::LoadMap/UpdateLoadedBlocks path cycles
; every valid Folder block registered by the main scene, and AssetCapture probes
; each loaded block automatically. Leave Cutscenes off unless video/cutscene
; assets are specifically needed.
;
; Output/status:
;   rtx-remix\logs\tod-forced-texture-probe
;   rtx-remix\logs\tod-asset-crawler.log
; ===========================================================================

[AssetCrawler]
Enabled=0
IncludeMaps=1
IncludeMissions=1
IncludeCutscenes=0
IncludePlayerdata=1
LoadSettleFrames=300
