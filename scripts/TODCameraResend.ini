; ===========================================================================
; INACTIVE as of 2026-06-07. The ASI no longer injects a sun light:
; kInjectSunLight = false in TODCameraResend.cpp. TOD's sky/skybox already casts
; the correct single sun shadow via Remix's environment probe; injecting a second
; directional light produced a competing "two opposite shadows" (it pointed a
; different way than the skybox sun, even when auto-aimed at the lens-flare sun).
;
; These values are kept for reference only and have NO effect while injection is
; disabled. To experiment with a crisp directional sun again you must re-enable
; kInjectSunLight (and kEnableSunAutoAim for SpriteHashHex/AutoAim) and rebuild,
; AND tame rtx.skyBrightness so the skybox shadow doesn't double up.
; ===========================================================================

[Sun]
; D3D directional light vector (fallback used only if AutoAim can't see the sun).
; Negative Y points downward. Flip X/Z to rotate the shadow direction.
DirectionX=-0.48
DirectionY=-0.8
DirectionZ=-0.25

DiffuseR=3.4
DiffuseG=3.05
DiffuseB=2.55
SpecularScale=1.0
Range=100000.0

; Auto-aim: read where TOD draws the sun billboard each frame and aim the injected
; light opposite it. SpriteHashHex is the Remix texture hash of TOD's sun/flare
; sprite (config, never in the binary). Confirmed working when active.
AutoAim=1
SpriteHashHex=0x5EF9EBC260F4B6BC
